name: Publier une version
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Vérifier le tag et la syntaxe Python
        run: |
          python3 - <<'PYTHON'
          import ast, os, pathlib
          version = pathlib.Path('VERSION').read_text().strip()
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Le tag doit correspondre à VERSION'
          for path in pathlib.Path('.').rglob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          PYTHON
      - name: Créer la publication GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Habbit $GITHUB_REF_NAME"
